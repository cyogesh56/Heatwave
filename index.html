<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Handsy</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var err = document.createElement('div');
        err.style.position = 'fixed';
        err.style.top = '0';
        err.style.left = '0';
        err.style.width = '100%';
        err.style.background = 'red';
        err.style.color = 'white';
        err.style.zIndex = '999999';
        err.style.padding = '20px';
        err.style.fontFamily = 'monospace';
        err.innerText = "Error: " + msg + "\nLine: " + line;
        document.body.appendChild(err);
      };
      window.onunhandledrejection = function(e) {
        var err = document.createElement('div');
        err.style.position = 'fixed';
        err.style.top = '0';
        err.style.left = '0';
        err.style.width = '100%';
        err.style.background = 'orange';
        err.style.color = 'white';
        err.style.zIndex = '999999';
        err.style.padding = '20px';
        err.style.fontFamily = 'monospace';
        err.innerText = "Promise Error: " + (e.reason ? e.reason.message || e.reason : "Unknown");
        document.body.appendChild(err);
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
