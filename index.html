    <style>
      body {
        background-color: #FFF7F2; /* Canvas color */
        margin: 0;
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      .app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        color: #1C1024;
      }
      .app-loader-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-color: rgba(104, 24, 214, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
      }
      .app-loader-icon svg {
        width: 40px;
        height: 40px;
        color: #6818D6;
      }
      .app-loader-text {
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        animation: fade 1.5s infinite ease-in-out alternate;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      @keyframes fade {
        from { opacity: 0.3; }
        to { opacity: 1; }
      }
    </style>
